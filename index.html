<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Performance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }
        body.dark {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .badge-trend {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-left: 6px;
        }
        .badge-trend.up {
            background-color: #dcfce7;
            color: #166534;
        }
        .badge-trend.down {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Ringkasan Performa</h2>
        <p>Top Akuisisi: <span id="sumTopAcq">-</span></p>
        <p>Top Konversi: <span id="sumTopConv">-</span></p>
        <p>Active Store: <span id="sumActiveStores">0 Store</span></p>
        <p>Catatan Isu: <span id="sumIssueCount">0 Catatan</span></p>
        <p>Periode Lalu (Bulan): <span id="sumPrevMonth">0</span> | Bulan Ini: <span id="sumCurrMonth">0</span> <span id="monthTrendBadge" class="badge-trend up">—</span></p>
        <p>Periode Lalu (Minggu): <span id="sumPrevWeek">0</span> | Minggu Ini: <span id="sumCurrWeek">0</span></p>
    </div>

    <script>
        function updateSummaryCard(storeList, globalList) {
            if (!storeList || storeList.length === 0 || !globalList || globalList.length === 0) {
                document.getElementById('sumTopAcq').textContent = '-';
                document.getElementById('sumTopConv').textContent = '-';
                document.getElementById('sumActiveStores').textContent = '0 Store';
                document.getElementById('sumIssueCount').textContent = '0 Catatan';
                document.getElementById('sumPrevMonth').textContent = '0';
                document.getElementById('sumCurrMonth').textContent = '0 <span id="monthTrendBadge" class="badge-trend up">—</span>';
                document.getElementById('sumPrevWeek').textContent = '0';
                document.getElementById('sumCurrWeek').textContent = '0 <span id="weeklyTrendBadge" class="badge-trend up">—</span>';
                return;
            }

            const topAcq = [...storeList].sort((a,b) => b.new_member - a.new_member)[0];
            document.getElementById('sumTopAcq').textContent = topAcq ? `${topAcq.store} (${topAcq.new_member})` : '-';

            const topConv = [...storeList]
                .filter(s => s.trx >= 1)
                .map(s => ({ ...s, rate: (s.new_member / s.trx) * 100 }))
                .sort((a,b) => b.rate - a.rate)[0];
            document.getElementById('sumTopConv').textContent = topConv ? `${topConv.store} (${topConv.rate.toFixed(1)}%)` : '-';

            document.getElementById('sumActiveStores').textContent = `${storeList.length} Store`;

            const issueCount = globalList.filter(d => (d.reason_zero && d.reason_zero !== '-') || (d.reason_gap && d.reason_gap !== '-')).length;
            document.getElementById('sumIssueCount').textContent = `${issueCount} Catatan`;

            const validMonths = [...new Set(globalList.map(d => d.monthStore))].filter(v => v && v !== '-' && !v.toLowerCase().includes('otp')).sort();
            let currMonthVal = 0;
            let prevMonthVal = 0;

            if (validMonths.length > 0) {
                const latestMonth = validMonths[validMonths.length - 1];
                const prevMonth = validMonths.length > 1 ? validMonths[validMonths.length - 2] : null;

                currMonthVal = globalList.filter(d => d.monthStore === latestMonth).reduce((sum, d) => sum + d.new_member, 0);
                if (prevMonth) {
                    prevMonthVal = globalList.filter(d => d.monthStore === prevMonth).reduce((sum, d) => sum + d.new_member, 0);
                }
            }

            document.getElementById('sumPrevMonth').textContent = prevMonthVal.toLocaleString('id-ID');

            let monthBadgeHTML = '<span id="monthTrendBadge" class="badge-trend up">—</span>';
            if (prevMonthVal > 0) {
                const diffMonth = ((currMonthVal - prevMonthVal) / prevMonthVal) * 100;
                const isUpMonth = diffMonth >= 0;
                monthBadgeHTML = `<span id="monthTrendBadge" class="badge-trend ${isUpMonth ? 'up' : 'down'}">${isUpMonth ? '▲ +' : '▼ '}${diffMonth.toFixed(1)}%</span>`;
            }
            document.getElementById('sumCurrMonth').innerHTML = `${currMonthVal.toLocaleString('id-ID')} ${monthBadgeHTML}`;

            const dailyMap = {};
            globalList.forEach(item => {
                if (!item.date) return;
                dailyMap[item.date] = (dailyMap[item.date] || 0) + item.new_member;
            });

            const sortedDates = Object.keys(dailyMap).sort((a, b) => new Date(a) - new Date(b));
            let currWeekVal = 0;
            let prevWeekVal = 0;
            const totalDays = sortedDates.length;

            if (totalDays > 0) {
                const currWeekDates = sortedDates.slice(Math.max(0, totalDays - 7));
                const prevWeekDates = sortedDates.slice(Math.max(0, totalDays - 14), Math.max(0, totalDays - 7));
                currWeekVal = currWeekDates.reduce((sum, d) => sum + dailyMap[d], 0);
                prevWeekVal = prevWeekDates.reduce((sum, d) => sum + dailyMap[d], 0);
            }

            document.getElementById('sumPrevWeek').textContent = prevWeekVal.toLocaleString('id-ID');
            
            let weekBadgeHTML = '<span id="weeklyTrendBadge" class="badge-trend up">—</span>';
            if (prevWeekVal > 0) {
                const diff = ((currWeekVal - prevWeekVal) / prevWeekVal) * 100;
                const isUp = diff >= 0;
                weekBadgeHTML = `<span id="weeklyTrendBadge" class="badge-trend ${isUp ? 'up' : 'down'}">${isUp ? '▲ +' : '▼ '}${diff.toFixed(1)}%</span>`;
            }
            document.getElementById('sumCurrWeek').innerHTML = `${currWeekVal.toLocaleString('id-ID')} ${weekBadgeHTML}`;
        }

        // Contoh saat data asli Anda sudah dimuat (panggil fungsi ini dengan data aktual dari Google Sheets/JSON Anda)
        // updateSummaryCard(dataStore, dataGlobal);
    </script>
</body>
</html>
