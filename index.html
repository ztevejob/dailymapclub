<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Performance Dashboard</title>
    <!-- CSS & Libraries (Tailwind / Chart.js / Leaflet jika ada) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }
        body.dark {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .badge-trend {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-trend.up {
            background-color: #dcfce7;
            color: #166534;
        }
        .badge-trend.down {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Ringkasan Performa</h2>
        <p>Top Akuisisi: <span id="sumTopAcq">-</span></p>
        <p>Top Konversi: <span id="sumTopConv">-</span></p>
        <p>Active Store: <span id="sumActiveStores">0 Store</span></p>
        <p>Catatan Isu: <span id="sumIssueCount">0 Catatan</span></p>
        <p>Periode Lalu (Bulan): <span id="sumPrevMonth">0</span> | Bulan Ini: <span id="sumCurrMonth">0</span> <span id="monthTrendBadge" class="badge-trend up">—</span></p>
        <p>Periode Lalu (Minggu): <span id="sumPrevWeek">0</span> | Minggu Ini: <span id="sumCurrWeek">0</span></p>
    </div>

    <script>
        function updateSummaryCard(storeList, globalList) {
            if (!storeList || storeList.length === 0) {
                const elements = ['sumTopAcq', 'sumTopConv', 'sumActiveStores', 'sumIssueCount', 'sumPrevWeek', 'sumCurrWeek', 'sumPrevMonth', 'sumCurrMonth'];
                elements.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = id.includes('Store') ? '0 Store' : (id.includes('Count') ? '0 Catatan' : '0');
                });
                return;
            }

            const topAcq = [...storeList].sort((a,b) => b.new_member - a.new_member)[0];
            const elTopAcq = document.getElementById('sumTopAcq');
            if (elTopAcq) elTopAcq.textContent = topAcq ? `${topAcq.store} (${topAcq.new_member})` : '-';

            const topConv = [...storeList]
                .filter(s => s.trx >= 1)
                .map(s => ({ ...s, rate: (s.new_member / s.trx) * 100 }))
                .sort((a,b) => b.rate - a.rate)[0];
            const elTopConv = document.getElementById('sumTopConv');
            if (elTopConv) elTopConv.textContent = topConv ? `${topConv.store} (${topConv.rate.toFixed(1)}%)` : '-';

            const elActiveStores = document.getElementById('sumActiveStores');
            if (elActiveStores) elActiveStores.textContent = `${storeList.length} Store`;

            const issueCount = globalList.filter(d => (d.reason_zero && d.reason_zero !== '-') || (d.reason_gap && d.reason_gap !== '-')).length;
            const elIssueCount = document.getElementById('sumIssueCount');
            if (elIssueCount) elIssueCount.textContent = `${issueCount} Catatan`;

            const validMonths = [...new Set(globalList.map(d => d.monthStore))].filter(v => v && v !== '-' && !v.toLowerCase().includes('otp')).sort();
            let currMonthVal = 0;
            let prevMonthVal = 0;

            if (validMonths.length > 0) {
                const latestMonth = validMonths[validMonths.length - 1];
                const prevMonth = validMonths.length > 1 ? validMonths[validMonths.length - 2] : null;

                currMonthVal = globalList.filter(d => d.monthStore === latestMonth).reduce((sum, d) => sum + d.new_member, 0);
                if (prevMonth) {
                    prevMonthVal = globalList.filter(d => d.monthStore === prevMonth).reduce((sum, d) => sum + d.new_member, 0);
                }
            }

            const elCurrMonth = document.getElementById('sumCurrMonth');
            const elPrevMonth = document.getElementById('sumPrevMonth');
            if (elCurrMonth) elCurrMonth.textContent = currMonthVal.toLocaleString('id-ID');
            if (elPrevMonth) elPrevMonth.textContent = prevMonthVal.toLocaleString('id-ID');

            const monthBadgeEl = document.getElementById('monthTrendBadge');
            if (monthBadgeEl) {
                if (prevMonthVal > 0) {
                    const diffMonth = ((currMonthVal - prevMonthVal) / prevMonthVal) * 100;
                    const isUpMonth = diffMonth >= 0;
                    monthBadgeEl.className = `badge-trend ${isUpMonth ? 'up' : 'down'}`;
                    monthBadgeEl.textContent = `${isUpMonth ? '▲ +' : '▼ '}${diffMonth.toFixed(1)}%`;
                } else {
                    monthBadgeEl.className = 'badge-trend up';
                    monthBadgeEl.textContent = '—';
                }
            }

            const dailyMap = {};
            globalList.forEach(item => {
                if (!item.date) return;
                dailyMap[item.date] = (dailyMap[item.date] || 0) + item.new_member;
            });

            const sortedDates = Object.keys(dailyMap).sort((a, b) => new Date(a) - new Date(b));
            let currWeekVal = 0;
            let prevWeekVal = 0;
            const totalDays = sortedDates.length;

            if (totalDays > 0) {
                const currWeekDates = sortedDates.slice(Math.max(0, totalDays - 7));
                const prevWeekDates = sortedDates.slice(Math.max(0, totalDays - 14), Math.max(0, totalDays - 7));
                currWeekVal = currWeekDates.reduce((sum, d) => sum + dailyMap[d], 0);
                prevWeekVal = prevWeekDates.reduce((sum, d) => sum + dailyMap[d], 0);
            }

            const elPrevWeek = document.getElementById('sumPrevWeek');
            if (elPrevWeek) elPrevWeek.textContent = prevWeekVal.toLocaleString('id-ID');
            
            let weekTrendHTML = '—';
            if (prevWeekVal > 0) {
                const diff = ((currWeekVal - prevWeekVal) / prevWeekVal) * 100;
                const isUp = diff >= 0;
                weekTrendHTML = `<span id="weeklyTrendBadge" class="badge-trend ${isUp ? 'up' : 'down'}">${isUp ? '▲ +' : '▼ '}${diff.toFixed(1)}%</span>`;
            } else {
                weekTrendHTML = `<span id="weeklyTrendBadge" class="badge-trend up">—</span>`;
            }

            const sumCurrWeekEl = document.getElementById('sumCurrWeek');
            if (sumCurrWeekEl) {
                sumCurrWeekEl.innerHTML = `${currWeekVal.toLocaleString('id-ID')} ${weekTrendHTML}`;
            }
        }

        // Contoh simulasi pemanggilan data kosong agar aman saat inisialisasi awal
        window.addEventListener('DOMContentLoaded', () => {
            updateSummaryCard([], []);
        });
    </script>
</body>
</html>
